[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "director-finance"
version = "0.1.0"
description = "An evidence-backed finance agent for hackathon directors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "mcp>=1.12,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
payments = ["x402[evm,httpx]==2.25.0"]

[project.scripts]
finance = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "app/assets/skills"
"supabase/migrations" = "app/assets/supabase/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires actual configured providers and can incur small costs"]

[tool.ruff]
line-length = 100
target-version = "py311"
