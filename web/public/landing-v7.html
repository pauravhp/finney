}</style><style>:root{--ink:#111311;--mint:#a7ff9c;--orange:#ff6831;--paper:#fff;--muted:#62665f;--line:#e3e6df;--ground:#f3f4ef;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}body{margin:0;font:16px/1.45 'Albert Sans',sans-serif;background:var(--ground);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}button,a,input,textarea{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #267d34;outline-offset:4px}button:active{transform:translateY(1px)}button svg{pointer-events:none}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:500;letter-spacing:-.045em}svg{display:block}.money{font-variant-numeric:tabular-nums;white-space:nowrap}.icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.button{display:inline-flex;justify-content:center;align-items:center;gap:20px;min-height:46px;padding:12px 23px;border-radius:6px;font-weight:500;font-size:16px;transition:background .18s,transform .18s var(--ease)}.button:hover{transform:translateY(-2px)}.button.mint{background:var(--mint);color:#111}.button.black{background:#111;color:#fff}.button.secondary{background:#edf0e9;color:#161916}.text-action{display:inline-flex;align-items:center;gap:12px;background:transparent;padding:3px 0;font-size:14px;min-height:30px}.text-action:hover{text-decoration:underline;text-underline-offset:5px}.quiet-label{font-size:13px;color:var(--muted)}.concept-bar{position:sticky;top:0;z-index:50;height:54px;background:#f9faf6;display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:24px;border-bottom:1px solid #e5e7df}.concept-name{font-size:15px;font-weight:600;background:transparent;display:flex;align-items:center;gap:9px;padding:5px 0}.concept-name span{font-size:11px;font-weight:400;color:#666c60}.concept-bar nav{display:flex;gap:3px;padding:4px;background:#ecede7;border function baseDetails(type){
 if(type==='review')return review();
 if(type==='about')return openDetail(`<h2>Finney v7.0</h2><p>A concept with sample HarborHacks data. It does not send email, run models or move money.</p><p>The scroll animation illustrates how Finney’s OpenCode + Harness² learning loop works. It does not claim a completed improvement. The source mapping is based on public main as of October 25, 2026.</p><p>Use Shift+P or the corner button to show or hide preview controls. Sample work and approvals reset when you reload.</p><button class="button secondary" data-action="reset">Reset concept</button>`);
 if(type==='procedure')return openDetail(`<div class="procedure-review"><span class="quiet-label">Illustrated change · Proposed</span><h2>Ask for evidence<br>at the right stage.</h2><dl><div><dt>Before</dt><dd>Require payment proof before recording an invoice.</dd></div><div><dt>Proposed</dt><dd>Record the unpaid invoice. Verify payment proof at settlement.</dd></div><div><dt>Checks</dt><dd>Correct amount. No duplicate obligation. Approval before payment.</dd></div></dl><button class="text-action" data-action="evaluation">How changes are tested ${icon('arrow')}</button></div>`);
 if(type==='venue')return openDetail(`<h2>Venue & catering</h2><dl class="decision-facts"><div><dt>Meals & catering</dt><dd class="money">${money(EVENT.rows[0].amount)}</dd></div><div><dt>Venue & AV</dt><dd class="money">${money(EVENT.rows[1].amount)}</dd></div><div><dt>Status</dt><dd>Committed</dd></div></dl><button class="text-action" data-desk="report">Open report ${icon('arrow')}</button>`);
 if(type==='evaluation')return openDetail(evaluationStory(),'evaluation');
 if(type==='controls')return openDetail(`<h2>What the controls check.</h2><ul class="control-list"><li><strong>Exact money</strong><span>Integer minor units and explicit currency.</span></li><li><strong>Balanced postings</strong><span>Debits and credits balance per currency.</span></li><li><strong>Current approval</strong><span>Bound to the recipient, amount and evidence version.</span></li><li><strong>One financial effect</strong><span>Duplicate requests and competing reservations are checked.</span></li><li><strong>Verified completion</strong><span>A payment needs matching settlement evidence.</span></li></ul><p>These mechanisms exist in the finance source. This HTML preview does not execute them or connect to the financial service.</p>`);
 if(type==='sponsors')return openDetail(`<h2>Sponsorship expected</h2><div class="detail-amount money">${money(EVENT.expected)}</div><p>Awaiting payment. It is excluded from cash received and available funds.</p><dl class="decision-facts"><div><dt>Cash received</dt><dd class="money">${money(EVENT.cash)}</dd></div><div><dt>Committed</dt><dd class="money">${money(total)}</dd></div><div><dt>Available</dt><dd class="money">${money(free)}</dd></div></dl>`);
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='preview-toggle'||b.dataset.action==='hide-preview')return setPreview(!previewOpen);
 if(b.dataset.view)return changeView(b.dataset.view);
 if(b.dataset.scroll){const target=document.getElementById(b.dataset.scroll);if(target)window.scrollTo({top:target.getBoundingClientRect().top+scrollY-$('.concept-bar').offsetHeight,behavior:paused?'instant':'smooth'});return;}
 if(b.dataset.desk){$('#detail').close();caseOpen=false;deskTab=b.dataset.desk;if(view!=='desk')changeView('desk');else render();return;}
 if(b.dataset.folderSelect){folder=b.dataset.folderSelect;let back=0;$$('.folder').forEach(f=>{const on=f.dataset.folder===folder;f.style.setProperty('--level',on?4:back++);f.classList.toggle('front',on);f.querySelector('.folder-tab').setAttribute('aria-pressed',String(on));f.querySelector('.folder-inside').innerHTML=on?folderInner(folder):'';});syncFolderColor();return;}
 if(b.dataset.evidence){openDetail(documentView(b.dataset.evidence),'document');return;}
 if(b.dataset.reviewSource){$('.review-document').innerHTML=documentView(b.dataset.reviewSource);$$('[data-review-source]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}
 if(b.dataset.pose){reply='';replyTitle='';clearTimeout(timer);updatePose(b.dataset.pose);return;}
 if(b.dataset.question){ask(b.dataset.question);return;}
 if(b.id==='motion-toggle')return setPaused(!paused);
 if(b.classList.contains('dialog-close'))return $('#detail').close();
 const a=b.dataset.action;
 if(a==='approve')return approve();
 if(a==='reset')return reset();
 if(a==='toggle-pop'){popOpen=!popOpen;$('.popover').classList.toggle('is-open',popOpen);$('.popover').inert=!popOpen;b.setAttribute('aria-expanded',String(popOpen));if(popOpen){updatePose(poseForCase());setTimeout(()=>$('#ask-finney')?.focus({preventScroll:true}),250);}return;}
 if(a==='replay'){const node=$('.character-stage');const old=$('.pop-character');old.remove();node.innerHTML=finney(pose,'pop-character');return;}
 if(a==='back-to-task'){reply='';replyTitle='';updatePose(poseForCase());return;}
 if(a==='retry'){updatePose('working');timer=setTimeout(()=>updatePose('idle'),paused?0:1200);return;}
 if(a==='download-report')return downloadCaseReport();
 if(a)details(a);
});
document.addEventListener('submit',e=>{if(e.target.id==='work-form'){e.preventDefault();const input=$('#work-input');if(!input.value.trim())return;queuedWork.unshift(input.value.trim());render();tell('Added to sample work');return;}if(e.target.matches('.composer')){e.preventDefault();const input=e.target.querySelector('input');const q=input.value;input.value='';ask(q);}else if(e.target.id==='details-form'){e.preventDefault();draft=$('#details-text').value;$('#detail').close();tell('Draft saved in this preview');}});
document.addEventListener('focusin',e=>{if(e.target.id==='ask-finney'&&pose!=='working'){$('.pop-character').dataset.pose='looking';}});
document.addEventListener('focusout',e=>{if(e.target.id==='ask-finney'&&$('.pop-character'))$('.pop-character').dataset.pose=pose;});
document.addEventListener('pointermove',e=>{const area=e.target.closest('[data-gaze]');if(!area||paused)return;const r=area.getBoundingClientRect();const x=Math.max(-4,Math.min(4,(e.clientX-r.x-r.width/2)/22));const y=Math.max(-3,Math.min(3,(e.clientY-r.y-r.height/2)/22));area.style.setProperty('--look-x',x+'px');area.style.setProperty('--look-y',y+'px');});
document.addEventListener('pointerout',e=>{const area=e.target.closest('[data-gaze]');if(area&&!area.contains(e.relatedTarget)){area.style.setProperty('--look-x','0px');area.style.setProperty('--look-y','0px');}});
document.addEventListener('keydown',e=>{if(e.shiftKey&&e.key.toLowerCase()==='p'&&!e.target.closest('input,textarea,[contenteditable=true]')){e.preventDefault();setPreview(!previewOpen);return;}if(e.key==='Escape'&&view==='companion'&&!$('#detail').open){popOpen=false;$('.popover').classList.remove('is-open');$('.popover').inert=true;$('.tray-button').setAttribute('aria-expanded','false');$('.tray-button').focus();}});
$('#detail').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
// v7 starts after case.js has installed the connected desk.
window.FinneyConcept={EVENT,total,free,setPreview,get previewOpen(){return previewOpen},get folder(){return folder},get engineeringTime(){return engineeringTime},changeView,get approved(){return approved},get pose(){return pose},get view(){return view},setPaused,reset:()=>reset()};
</script><script>/* Scripted, offline case. No upload, model, mailbox or payment connection. */
const CATERING=Object.freeze({vendor:'Campus Catering',invoice:'CC-108',total:1260000,deposit:480000,balance:780000,budget:2000000,openingCash:4800000});
const FLOW={stage:'new',step:-1,note:'Check what’s left to pay on this invoice.',events:[]};
let caseOpen=false,caseDoc='invoice',docTouched=false,caseTimers=[];
const CASE_LABELS={new:'Ready to send',queued:'Queued',checking:'Checking',needs_review:'Needs you',held:'On hold',approved:'Payment pending',confirming:'Confirming payment',complete:'Paid'};
const CASE_NEXT={new:['queued'],queued:['checking'],checking:['needs_review'],needs_review:['held','approved'],held:['needs_review'],approved:['confirming'],confirming:['complete'],complete:[]};
const caseNeedsYou=()=>FLOW.stage==='needs_review';
const casePaid=()=>FLOW.stage==='complete';
function poseForCase(){return ({new:'idle',queued:'working',checking:'working',needs_review:'attention',held:'blocked',approved:'working',confirming:'working',complete:'success'})[FLOW.stage];}
function caseLabel(){return CASE_LABELS[FLOW.stage];}
function caseEvent(actor,text){FLOW.events.push({actor,text,time:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});}
function caseLater(fn,ms){caseTimers.push(setTimeout(fn,ms));}
function clearCaseTimers(){caseTimers.forEach(clearTimeout);caseTimers=[];}
function syncCaseMoney(){
 EVENT.cash=CATERING.openingCash-(casePaid()?CATERING.balance:0);
 EVENT.rows[0].amount=casePaid()?0:CATERING.balance;
 EVENT.rows[0].paid=casePaid()?CATERING.total:CATERING.deposit;
 total=EVENT.rows.reduce((sum,row)=>sum+row.amount,0);free=EVENT.cash-total;
 approved=['approved','confirming','complete'].includes(FLOW.stage);
}
function refreshCase(){
 const old=document.activeElement;const id=old?.id;const doc=old?.dataset?.caseDoc;
 syncCaseMoney();pose=poseForCase();reply='';replyTitle='';render();
 const announcement=document.getElementById('case-announcement');if(announcement)announcement.textContent=caseNeedsYou()?'Approval needed: $7,800 to Campus Catering.':casePaid()?'Sample payment confirmed. Catering invoice settled.':caseLabel();
 if(id)document.getElementById(id)?.focus({preventScroll:true});
 else if(doc)document.querySelector(`[data-case-doc="${doc}"]`)?.focus({preventScroll:true});
}
function caseTransition(next){if(!CASE_NEXT[FLOW.stage]?.includes(next))return false;FLOW.stage=next;refreshCase();return true;}
function startCase(note){
 if(FLOW.stage!=='new')return;
 FLOW.note=(note||FLOW.note).trim();caseOpen=true;caseDoc='invoice';docTouched=false;
 caseEvent('You','Added catering invoice CC-108.');caseTransition('queued');
 caseLater(()=>{FLOW.step=0;caseTransition('checking');},550);
 caseLater(()=>{if(FLOW.stage!=='checking')return;FLOW.step=1;caseEvent('Finney','Read the $12,600 invoice.');refreshCase();},1600);
 caseLater(()=>{if(FLOW.stage!=='checking')return;FLOW.step=2;caseEvent('Finney','Matched the $4,800 deposit to this commitment.');refreshCase();},2850);
 caseLater(()=>{if(FLOW.stage!=='checking')return;FLOW.step=3;caseEvent('Finney','Checked the catering budget. $7,400 remains.');caseEvent('Finney','Prepared the $7,800 balance for your approval.');caseTransition('needs_review');},4200);
}
function approve(){
 if(!caseNeedsYou())return;
 caseEvent('You','Approved $7,800 to Campus Catering for CC-108.');
 caseTransition('approved');
 caseLater(()=>{if(FLOW.stage!=='approved')return;caseEvent('Finney','Submitted the approved sample payment.');caseTransition('confirming');},1900);
 caseLater(()=>{if(FLOW.stage!=='confirming')return;caseEvent('Finney','Confirmed sample receipt SAMPLE-PAY-108. Invoice settled.');if(!docTouched)caseDoc='payment';caseTransition('complete');},4600);
}
function holdCase(){if(!caseNeedsYou())return;caseEvent('You','Put the payment on hold.');caseTransition('held');}
function resumeCase(){if(FLOW.stage!=='held')return;caseEvent('You','Returned the payment for review.');caseTransition('needs_review');}
function openCase(){caseOpen=true;deskTab='work';$('#detail').close();if(view!=='desk')changeView('desk');else render();window.scrollTo(0,0);}
function review(){openCase();}
function reset(){
 clearCaseTimers();FLOW.stage='new';FLOW.step=-1;FLOW.note='Check what’s left to pay on this invoice.';FLOW.events=[];
 caseOpen=false;caseDoc='invoice';docTouched=false;queuedWork.length=0;reply='';draft='';$('#detail').close();deskTab='work';view='desk';refreshCase();window.scrollTo(0,0);
}
function statusBadge(){return `<span class="case-status is-${FLOW.stage}">${caseLabel()}</span>`;}
function sampleScope(){return `<button class="sample-scope" data-action="about">HarborHacks <span>Sample event</span></button>`;}
function sidebar(){return `<aside class="sidebar"><button class="brand-button" data-view="landing">${logo()}</button><div class="workspace-name">HarborHacks <span>Sample event</span></div><nav aria-label="Workspace">${[['work','Work','review'],['review','To review','review'],['overview','Overview','overview'],['report','Reports','report'],['learning','Agent','learning']].map(([id,label,ic])=>`<button data-desk="${id}" aria-current="${deskTab===id?'page':'false'}">${icon(ic)}<span>${label}</span>${id==='review'&&caseNeedsYou()?'<span class="nav-count">1</span>':''}</button>`).join('')}</nav><button class="sidebar-companion" data-view="companion">${finney(poseForCase())}<span>Open Finney</span></button><button class="reset-demo" data-action="reset">Restart case</button></aside>`;}
function desk(){return `<div class="desk"><div class="desk-sidebar">${sidebar()}</div><div class="desk-content">${deskTab==='work'?(caseOpen&&FLOW.stage!=='new'?caseView():work()):deskTab==='review'?reviewQueue():deskTab==='overview'?overview():deskTab==='report'?reports():learning()}</div></div>`;}

function work(){
 if(FLOW.stage!=='new')return `<header class="desk-title"><h1>Work</h1>${sampleScope()}</header><section class="case-register"><header><h2>${casePaid()?'Completed':'In progress'}</h2><span>1</span></header><button class="case-list-row" data-case-action="open"><span class="case-file-mark">${icon('source')}</span><span><strong>Campus Catering</strong><small>Invoice CC-108</small></span>${statusBadge()}<strong class="money">${money(CATERING.balance)}</strong>${icon('arrow')}</button></section>`;
 return `<header class="desk-title"><h1>Work</h1>${sampleScope()}</header><div class="intake-layout"><form class="intake-composer" id="intake-form"><header><h2>New work</h2>${finney('idle','intake-finney')}</header><label class="sr-only" for="intake-note">Message to Finney</label><textarea id="intake-note" maxlength="600" rows="3">${escapeHTML(FLOW.note)}</textarea><button type="button" class="attached-invoice" data-case-source="invoice">${icon('source')}<span><strong>Catering invoice.pdf</strong><small>CC-108 · 1 page</small></span><b>PDF</b></button><footer><button type="submit" class="button black" id="send-case">Send to Finney ${icon('arrow')}</button></footer></form><section class="on-file"><h2>On file</h2><button data-case-source="agreement"><span>Catering commitment<small>Meals & catering</small></span><strong class="money">${money(CATERING.total)}</strong>${icon('arrow')}</button><button data-case-source="deposit"><span>Deposit payment<small>23 Oct · Confirmed</small></span><strong class="money">${money(CATERING.deposit)}</strong>${icon('arrow')}</button><button data-desk="overview"><span>Meals & catering<small>Budget allocation</small></span><strong class="money">${money(CATERING.budget)}</strong>${icon('arrow')}</button></section></div>`;
}
function caseView(){return `<header class="case-heading"><div><button class="case-back" data-case-action="back">${icon('arrow')} Work</button><h1>Campus Catering</h1><span>Invoice CC-108 · Due 30 Oct</span></div><div>${sampleScope()}${statusBadge()}</div></header><div class="case-layout"><section class="case-evidence"><nav class="case-doc-tabs" aria-label="Case evidence">${[['invoice','Invoice'],...(FLOW.step>=2?[['deposit','Deposit']]:[]),...(casePaid()?[['payment','Receipt']]:[]),['history','Activity']].map(([id,label])=>`<button data-case-doc="${id}" aria-pressed="${caseDoc===id}">${label}</button>`).join('')}</nav><div class="case-document">${caseDocument(caseDoc)}</div></section><aside class="decision-panel" aria-label="Finney’s work">${caseDecision()}</aside></div>`;}
function checkRow(label,done,current){return `<li class="${done?'is-done':current?'is-current':''}"><span class="work-mark">${done?icon('check'):current?'<i class="work-spinner"></i>':'<i class="work-pending"></i>'}</span>${label}</li>`;}
function caseDecision(){
 const stage=FLOW.stage;
 const head=`<header class="decision-finney">${finney(poseForCase(),'case-finney')}<span>Finney</span></header>`;
 if(['queued','checking'].includes(stage))return `${head}<h2>${stage==='queued'?'Got it.':'Checking the invoice.'}</h2><ul class="case-checks">${checkRow(FLOW.step>0?'Invoice read':'Read the invoice',FLOW.step>0,FLOW.step===0)}${checkRow(FLOW.step>1?'$4,800 deposit matched':'Match earlier payments',FLOW.step>1,FLOW.step===1)}${checkRow('Check the budget',false,FLOW.step===2)}</ul>`;
 if(stage==='needs_review'||stage==='held')return `${head}<h2>${stage==='held'?'Payment on hold.':'Pay the balance?'}</h2><dl class="payment-math"><div><dt>Invoice total</dt><dd class="money">${money(CATERING.total)}</dd></div><div><dt>Deposit paid</dt><dd class="money">−${money(CATERING.deposit)}</dd></div><div class="balance-due"><dt>Remaining</dt><dd class="money">${money(CATERING.balance)}</dd></div></dl><div class="payment-recipient"><span>To</span><strong>Campus Catering</strong></div><div class="case-budget-room"><span>Meals & catering</span><span class="money">${compact(CATERING.budget-CATERING.total)} left</span></div><div class="case-decision-actions">${stage==='held'?'<button class="button black" data-case-action="resume">Resume review</button>':`<button class="button black" data-action="approve" id="approve-balance">Approve ${compact(CATERING.balance)}</button><button class="button secondary" data-case-action="hold">Hold</button>`}</div>`;
 if(stage==='approved'||stage==='confirming')return `${head}<h2>${stage==='approved'?'Payment pending.':'Confirming payment.'}</h2><strong class="case-main-amount money">${money(CATERING.balance)}</strong><p class="case-payee">Campus Catering</p><ul class="case-checks">${checkRow('Approved by you',true,false)}${checkRow(stage==='confirming'?'Sample payment submitted':'Send approved payment',stage==='confirming',stage==='approved')}${checkRow('Confirm receipt',false,stage==='confirming')}</ul>`;
 if(stage==='complete')return `${head}<h2>Paid.</h2><strong class="case-main-amount money">${money(CATERING.balance)}</strong><p class="case-payee">Campus Catering</p><div class="case-settled">${icon('check')} Invoice settled</div><dl class="completion-position"><div><dt>Cash on hand</dt><dd class="money">${money(EVENT.cash)}</dd></div><div><dt>Available to commit</dt><dd class="money">${money(free)}</dd></div></dl><div class="case-decision-actions"><button class="button black" data-case-doc="payment">Open receipt ${icon('arrow')}</button><button class="text-action" data-desk="report">View report ${icon('arrow')}</button></div>`;
 return '';
}
function caseDocument(type){
 if(type==='history')return `<div class="case-history"><h2>Activity</h2><ol>${FLOW.events.map(e=>`<li><span class="event-dot"></span><div><strong>${e.actor}</strong><p>${escapeHTML(e.text)}</p></div><time>${e.time}</time></li>`).join('')}</ol>${FLOW.note?`<div class="original-request"><span>Your request</span><p>${escapeHTML(FLOW.note)}</p></div>`:''}</div>`;
 if(type==='agreement')return `<article class="source-paper"><header><h2>Catering commitment</h2><span>HarborHacks</span></header><div class="source-party">Campus Catering<span>Meals & catering</span></div><dl class="source-totals"><div><dt>Agreed amount</dt><dd>${money(CATERING.total)}</dd></div><div><dt>Deposit paid</dt><dd>−${money(CATERING.deposit)}</dd></div><div class="source-total"><dt>Open commitment</dt><dd>${money(CATERING.balance)}</dd></div></dl><footer>Commitment CAT-108 · USD</footer></article>`;
 if(type==='deposit'||type==='payment'){
  const paid=type==='payment';if(paid&&!casePaid())return '<div class="receipt-pending">Receipt pending.</div>';
  return `<article class="source-paper payment-paper"><header><h2>Payment receipt</h2><span>${paid?'25':'23'} Oct 2026</span></header><span class="sample-receipt">Sample ${paid?'payment':'deposit'}</span><strong class="receipt-sum money">${money(paid?CATERING.balance:CATERING.deposit)}</strong><dl class="receipt-facts"><div><dt>From</dt><dd>HarborHacks</dd></div><div><dt>To</dt><dd>Campus Catering</dd></div><div><dt>For</dt><dd>Invoice CC-108</dd></div><div><dt>Status</dt><dd class="receipt-confirmed">${icon('check')} Confirmed</dd></div><div><dt>Reference</dt><dd>SAMPLE-${paid?'PAY':'DEPOSIT'}-108</dd></div></dl>${paid?`<details class="journal-detail"><summary>Journal entry</summary><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody><tr><td>Catering payable</td><td>${money(CATERING.balance)}</td><td>—</td></tr><tr><td>Cash</td><td>—</td><td>${money(CATERING.balance)}</td></tr></tbody></table></details>`:''}<footer>USD · Sample event</footer></article>`;
 }
 return `<article class="source-paper invoice-paper"><header><h2>Campus Catering</h2><span>Invoice CC-108</span></header><div class="invoice-parties"><div><span>Bill to</span><strong>HarborHacks</strong></div><div><span>Due</span><strong>30 Oct 2026</strong></div></div><table class="invoice-lines"><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td>Meals & refreshments<small>600 × $21.00</small></td><td class="money">${money(CATERING.total)}</td></tr></tbody></table><dl class="source-totals"><div><dt>Total</dt><dd class="money">${money(CATERING.total)}</dd></div><div><dt>Deposit received</dt><dd class="money">−${money(CATERING.deposit)}</dd></div><div class="source-total"><dt>Balance due</dt><dd class="money">${money(CATERING.balance)}</dd></div></dl><footer>Original invoice · USD</footer></article>`;
}
function reviewTile(){return `<section class="review-card"><div class="section-title"><h2>${caseNeedsYou()?'Needs you':caseLabel()}</h2>${caseNeedsYou()?'<span class="count">1</span>':''}</div><div class="review-person"><span class="avatar">C</span><div><strong>Campus Catering</strong><span>Invoice CC-108</span></div><b class="money">${money(CATERING.balance)}</b></div><button class="button black" data-case-action="open">${caseNeedsYou()?'Review payment':'Open case'} ${icon('arrow')}</button></section>`;}
function reviewQueue(){return `<header class="desk-title"><h1>To review${caseNeedsYou()?' <span>1</span>':''}</h1>${sampleScope()}</header>${caseNeedsYou()?reviewTile():`<div class="empty-review">${finney(casePaid()?'success':'idle')}<h2>Nothing waiting on you.</h2><button class="text-action" data-case-action="open">${FLOW.stage==='new'?'Open invoice':'Open case'} ${icon('arrow')}</button></div>`}`;}
function budget(){return `<section class="budget"><div class="section-title"><h2>Budget</h2><span>USD</span></div><div class="budget-head"><span></span><span>Paid + committed</span><span>Allocated</span></div>${EVENT.rows.map(r=>`<div class="budget-item"><span class="budget-name">${r.name}</span><strong class="money">${money(r.amount+(r.paid||0))}</strong><span class="money budget-cap">${money(r.budget)}</span><div class="budget-track"><i style="width:${100*(r.amount+(r.paid||0))/r.budget}%"></i></div></div>`).join('')}</section>`;}
function overview(){return `<header class="desk-title"><h1>Overview</h1>${sampleScope()}</header><div class="balance-strip"><div class="balance-main"><span>Available to commit</span><strong class="money">${money(free)}</strong></div><div><span>Cash on hand</span><strong class="money">${money(EVENT.cash)}</strong></div><div><span>Committed</span><strong class="money">${money(total)}</strong></div><button class="expected" data-action="sponsors"><span>Expected sponsorship</span><strong class="money">${money(EVENT.expected)}</strong>${icon('arrow')}</button></div><div class="desk-columns">${budget()}${reviewTile()}</div><section class="recent"><div class="section-title"><h2>Latest</h2><button class="text-action" data-desk="report">View report ${icon('arrow')}</button></div><button class="activity-row case-activity-link" data-case-action="open"><span class="activity-dot"></span><span>Campus Catering</span><span>${caseLabel()}</span><b class="money">${money(CATERING.balance)}</b></button></section>`;}
function reports(){return `<header class="desk-title"><h1>Event report</h1><button class="button secondary" data-action="download-report">Download CSV ${icon('arrow')}</button></header><section class="report-sheet"><div class="report-heading"><div>HarborHacks<span>Sample event · USD</span></div><strong>2026</strong></div><table><tbody><tr><td>Cash on hand</td><td>${money(EVENT.cash)}</td></tr><tr><td>Outstanding commitments</td><td>−${money(total)}</td></tr></tbody><tfoot><tr><th>Available to commit</th><th>${money(free)}</th></tr></tfoot></table><div class="report-case"><h2>Campus Catering</h2>${statusBadge()}<dl><div><dt>Invoice</dt><dd>${money(CATERING.total)}</dd></div><div><dt>Paid to date</dt><dd>${money(casePaid()?CATERING.total:CATERING.deposit)}</dd></div><div><dt>Outstanding</dt><dd>${money(casePaid()?0:CATERING.balance)}</dd></div></dl><button class="text-action" data-case-action="open">Open case ${icon('arrow')}</button></div><div class="report-open"><h2>Expected income</h2><div><span>Sponsorship · Not received</span><b class="money">${money(EVENT.expected)}</b></div></div></section>`;}
function downloadCaseReport(){
 const rows=[['HarborHacks — sample event report','USD'],['Cash on hand',(EVENT.cash/100).toFixed(2)],['Outstanding commitments',(total/100).toFixed(2)],['Available to commit',(free/100).toFixed(2)],['Expected sponsorship, excluded from cash',(EVENT.expected/100).toFixed(2)],['Campus Catering invoice CC-108',(CATERING.total/100).toFixed(2)],['Prior deposit',(CATERING.deposit/100).toFixed(2)],['New confirmed sample payment',casePaid()?(CATERING.balance/100).toFixed(2):'0.00'],['Catering outstanding',casePaid()?'0.00':(CATERING.balance/100).toFixed(2)],['Case status',caseLabel()],[],['Activity','Actor','Time'],...FLOW.events.map(e=>[e.text,e.actor,e.time])];
 const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='HarborHacks-Catering-Case-v7.0.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return csv;
}
function financeBook(){return `<article class="finance-book" data-ui><header><h3>HarborHacks</h3><span>USD</span></header><div class="book-position"><div><span>Available to commit</span><strong class="money">${money(free)}</strong></div><dl><div><dt>Cash on hand</dt><dd class="money">${compact(EVENT.cash)}</dd></div><div><dt>Committed</dt><dd class="money">−${compact(total)}</dd></div></dl></div><div class="book-records"><button class="book-row" data-case-action="open"><span>Campus Catering<small>Invoice CC-108</small></span><strong class="money">${money(CATERING.balance)}</strong><small>${caseLabel()}</small></button><button class="book-row" data-desk="overview"><span>Venue & AV</span><strong class="money">${money(840000)}</strong><small>Committed</small></button><button class="book-row" data-desk="overview"><span>Prizes & travel</span><strong class="money">${money(600000)}</strong><small>Committed</small></button></div><button class="book-expected" data-action="sponsors"><span>Expected sponsorship</span><strong class="money">${money(EVENT.expected)}</strong>${icon('arrow')}</button><footer><button class="text-action" data-desk="report">Open report ${icon('arrow')}</button></footer></article>`;}
function details(type){
 if(type==='review')return openCase();
 if(type==='about')return openDetail(`<h2>Finney v7.0</h2><p>An offline concept with one scripted catering case. The invoice, deposit, checks, approval and payment receipt are sample data. No money moves and no models, mailboxes or payment services are connected.</p><p>Approval and confirmation are separate stages. The sample event uses one director’s approval. Restart case resets only this preview; reloading starts a fresh case.</p><p>Shift+P toggles the preview bar.</p><button class="button secondary" data-action="reset">Restart case</button>`);
 if(type==='sponsors')return openDetail(`<h2>Sponsorship expected</h2><div class="detail-amount money">${money(EVENT.expected)}</div><p>Awaiting payment. Excluded from cash on hand.</p>`);
 return baseDetails(type);
}
function popContent(){
 if(reply)return `<div class="pop-answer"><div class="answer-title">${replyTitle}<button aria-label="Back to case" data-action="back-to-task">×</button></div>${reply}</div>`;
 return `<div class="pop-task"><div class="pop-task-head"><span>Campus Catering<small>${caseLabel()}</small></span><strong class="money">${money(CATERING.balance)}</strong></div><button class="button black" data-case-action="${casePaid()?'receipt':'open'}">${caseNeedsYou()?'Review payment':casePaid()?'Open receipt':'Open case'} ${icon('arrow')}</button></div>`;
}
function poseTitle(){return pose==='looking'?'I’m listening.':pose==='sleep'?'Be right back.':({new:'Ready.',queued:'On it.',checking:'Checking…',needs_review:'One for you.',held:'On hold.',approved:'Approved.',confirming:'Confirming…',complete:'Paid.'})[FLOW.stage];}
function ask(question){
 if(!question.trim())return;
 if(/sponsor|income/i.test(question)){replyTitle='Expected sponsorship';reply=`<div class="answer-amount money">${money(EVENT.expected)}</div><div class="answer-state">Not received</div>`;}
 else if(/budget|cash|avail|left|money/i.test(question)){replyTitle='Available to commit';reply=`<div class="answer-amount money">${money(free)}</div><div class="answer-row"><span>Cash</span><b class="money">${money(EVENT.cash)}</b></div><div class="answer-row"><span>Committed</span><b class="money">−${money(total)}</b></div>`;}
 else{replyTitle='Campus Catering';reply=`<div class="answer-amount money">${money(CATERING.balance)}</div><div class="answer-state">${caseLabel()}</div><button class="text-action" data-case-action="open">Open case ${icon('arrow')}</button>`;}
 updatePose(poseForCase());
}
document.addEventListener('submit',e=>{if(e.target.id!=='intake-form')return;e.preventDefault();startCase($('#intake-note').value);});
document.addEventListener('input',e=>{if(e.target.id==='intake-note'&&FLOW.stage==='new')FLOW.note=e.target.value;});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.caseAction==='open')return openCase();
 if(b.dataset.caseAction==='receipt'&&casePaid()){caseDoc='payment';docTouched=true;openCase();if(innerWidth<=760)document.querySelector('.case-evidence')?.scrollIntoView({behavior:paused?'instant':'smooth'});return;}
 if(b.dataset.caseAction==='back'){caseOpen=false;render();window.scrollTo(0,0);return;}
 if(b.dataset.caseAction==='hold')return holdCase();
 if(b.dataset.caseAction==='resume')return resumeCase();
 if(b.dataset.caseSource)return openDetail(caseDocument(b.dataset.caseSource),'source');
 if(b.dataset.caseDoc){
  if(b.dataset.caseDoc==='payment'&&!casePaid())return;
  caseDoc=b.dataset.caseDoc;docTouched=true;render();
  if(innerWidth<=760)document.querySelector('.case-evidence')?.scrollIntoView({behavior:paused?'instant':'smooth',block:'start'});
  document.querySelector(`[data-case-doc="${caseDoc}"]`)?.focus({preventScroll:true});
 }
});
// Explicit fixture links are for reviewing the concept's screens, never live state.
const fixtureStage=null;
if(['checking','needs_review','held','approved','confirming','complete'].includes(fixtureStage)){
 FLOW.stage=fixtureStage;FLOW.step=fixtureStage==='checking'?1:3;caseOpen=true;view='desk';deskTab='work';
 caseEvent('You','Added catering invoice CC-108.');caseEvent('Finney','Matched the $4,800 deposit.');
 if(['approved','confirming','complete'].includes(fixtureStage))caseEvent('You','Approved $7,800 to Campus Catering.');
 if(fixtureStage==='complete'){caseDoc='payment';caseEvent('Finney','Confirmed sample receipt SAMPLE-PAY-108.');}
}
syncCaseMoney();pose=poseForCase();render();
Object.defineProperties(window.FinneyConcept,{
 total:{get:()=>total},free:{get:()=>free},
 caseState:{get:()=>JSON.parse(JSON.stringify(FLOW))},
 cash:{get:()=>EVENT.cash},
});
Object.assign(window.FinneyConcept,{CATERING,startCase,approve,holdCase,resumeCase,openCase,downloadCaseReport});
</script></body></html>
